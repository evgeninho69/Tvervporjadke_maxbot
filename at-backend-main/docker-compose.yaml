services:
  backend:
    container_name: at-backend
    tty: true
    stdin_open: true
    build:
      context: ./
      args:
        - STORAGE_USER=${STORAGE_USER}
        - STORAGE_NAME=${STORAGE_NAME}
        - STORAGE_PORT=${STORAGE_PORT}
        - STORAGE_PASSWORD=${STORAGE_PASSWORD}
        - STORAGE_HOST=${STORAGE_HOST}
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/citizen/files:/files
    env_file:
      - ./configs/.env
    networks:
      - at-network

  postgres:
    container_name: at-postgres
    image: postgres:16.3-alpine3.20
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "temp_file_limit=10GB"
      - "-c"
      - "log_min_duration_statement=200ms"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "lock_timeout=1s"
      - "-c"
      - "statement_timeout=60s"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_DB: ${STORAGE_NAME}
      POSTGRES_USER: ${STORAGE_USER}
      POSTGRES_PASSWORD: ${STORAGE_PASSWORD}
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - at-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${STORAGE_USER} -d ${STORAGE_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - at-network

  pgadmin:
    container_name: at-pgadmin
    image: dpage/pgadmin4:9.6
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=True
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=10
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - at-network
  
  object-storage:
    container_name: at-object-storage
    image: minio/minio
    restart: unless-stopped
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"  # Внешний порт → внутренний 9000 (API)
      - "${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"  # Консоль (значение по умолчанию 9001)
    environment:
      MINIO_ROOT_USER: "${OBJECT_STORAGE_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${OBJECT_STORAGE_SECRET_ACCESS_KEY}"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - at-network
    healthcheck:
      test: ["CMD", "curl", "-f", "${OBJECT_STORAGE_ENDPOINT}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

volumes:
  at-data:
  pgadmin-data:
  minio-data:

networks:
  at-network:
    driver: bridge