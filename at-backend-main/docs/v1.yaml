openapi: 3.1.0
info:
  title: Active Tver API
  version: "1.0"

urls:
  - url: example.ru/v1

tags:
  - name: admin
    description: Действия, доступ к которым имеют только администраторы
  - name: announcement
    description: Действия над объявлениями, доступные всем пользователям
  - name: auth
    description: Все касающееся идентификации, аутентификации и авторизации
  - name: categories
    description: Все необходимое для запроса и обновления списка категорий на клиенте
  - name: claims
    description: Действия над заявками, доступные всем пользователям
  - name: user
    description: Действия над своим аккаунтом, доступные пользователю
  - name: map
    description: Эндпоинты для взаимодействия с картой

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    refresh_token:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
    tokensPair:
      allOf:
        - $ref: "#/components/schemas/refresh_token"
        - type: object
          properties:
            refresh_token:
              type: string
            access_token:
              type: string
          required:
            - refresh_token
            - access_token
    email:
      type: object
      properties:
        email:
          type: string
          example: example@example.com
      required:
        - email
    claim:
      type: object
      required:
        - title
        - description
        - category
        - latitude
        - longitude
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        latitude:
          type: number
          format: latitude
        longitude:
          type: number
          format: longitude
    claimFullForUsers:
      allOf:
        - $ref: "#/components/schemas/claim"
        - required:
            - id
            - created_at
            - updated_at
            - status_updated_at
            - feedback_updated_at
            - photos
            - status
          properties:
            id:
              type: integer
              format: int64
              minimum: 0
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            status_updated_at:
              type: string
              format: date-time
            feedback_updated_at:
              type: string
              format: date-time
            feedback:
              type: string
            photos:
              type: array
              items:
                type: string
                format: url
            status:
              type: string
              enum:
                - "declined"
                - "accepted"
                - "pending"
                - "completed"
    claimFullForAdmins:
      allOf:
        - $ref: "#/components/schemas/claimFullForUsers"
          properties:
            created_by:
              type: integer
              format: int64
              minimum: 0
            email:
              type: string
    announcement:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
    announcementFullForUsers:
      allOf:
        - $ref: "#/components/schemas/announcement"
        - required:
            - id
            - created_at
          properties:
            id:
              type: integer
              format: int64
              minimum: 0
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    announcementFullForAdmins:
      allOf:
        - $ref: "#/components/schemas/announcementFullForUsers"
        - required:
            - admin
          properties:
            created_by:
              type: integer
              format: int64
              minimum: 0
            updated_by:
              type: integer
              format: int64
              minimum: 0
    categories:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            type: object
            required:
              - name
              - subcategories
            properties:
              name:
                type: string
                example: "Example category"
              subcategories:
                type: array
                items:
                  type: string
                  example: "Example subcategory"
    user:
      allOf:
        - $ref: "#/components/schemas/email"
        - type: object
          required:
            - uid
            - registered_at
          properties:
            uid:
              type: integer
              minimum: 1
            registered_at:
              type: string
              format: date-time
    admin:
      allOf:
        - $ref: "#/components/schemas/email"
        - type: object
          required:
            - is_super_admin
          properties:
            is_super_admin:
              type: boolean
    adminPrivileges:
      required:
        - is_admin
        - is_super_admin
      properties:
            is_super_admin:
              type: boolean
            is_admin:
              type: boolean

  requestBodies:
    email:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/email"
      required: true

  responses:
    internalServerError:
      description: Ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    badRequest:
      description: Допущена синтаксическая ошибка в запросе
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    unprocessableEntity:
      description: Допущена семантическая ошибка в запросе (см. содержимое ответа)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    notFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error"
    error:
      description: Ошибка
      content:
          application/json:
            schema:
              $ref: "#/components/schemas/error"


paths:
  # ! Эндпоинты для авторизации
  /v1/auth/login:
    post:
      tags:
        - auth
      requestBody:
        $ref: "#/components/requestBodies/email"
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "204":
          description: OK

  /v1/auth/confirm-login:
    post:
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/email"
                - type: object
                  properties:
                    code:
                      type: integer
                      format: int64
                      minimum: 0
                  required:
                    - code
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "401":
          description: Код некорректен или пользователь не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "429":
          description: Исчерпано количество попыток ввода кода
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "200":
          description: OK, пользователь аутентифицирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tokensPair"

  /v1/auth/refresh:
    post:
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/refresh_token"
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "401":
          description: Токен не найден, некорректен или просрочен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "200":
          description: OK, токены обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tokensPair"

  /v1/auth/logout:
    post:
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/refresh_token"
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "401":
          description: Токен не найден или некорректен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "204":
          description: OK

  /v1/auth/logout-all-devices:
    post:
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "204":
          description: OK

  # ! Эндпоинты для заявок
  /v1/my/claims/problem:
    post:
      tags:
        - claims
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/claim"
                - properties:
                    photos:
                      type: array
                      items:
                        type: string
                        format: binary
                      description: Список файлов (опционально)
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    minimum: 0

  /v1/my/claims/proposal:
    post:
      tags:
        - claims
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - latitude
                - longitude
              properties:
                title:
                  type: string
                description:
                  type: string
                latitude:
                  type: number
                  format: latitude
                longitude:
                  type: number
                  format: longitude
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "413":
          description: Request entity too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    minimum: 0

  /v1/my/claims/{claimID}:
    get:
      tags:
        - claims
      security:
        - bearerAuth: []
      parameters:
        - name: claimID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      responses:
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/claimFullForUsers"

    put:
      tags:
        - claims
      security:
        - bearerAuth: []
      parameters:
        - name: claimID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/claim"
        required: true
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "404":
          $ref: "#/components/responses/notFound"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "403":
          description: Пользователь не может выполнить эту операцию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"

    delete:
      tags:
        - claims
      security:
        - bearerAuth: []
      parameters:
        - name: claimID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "404":
          $ref: "#/components/responses/notFound"
        "403":
          description: Пользователь не может выполнить эту операцию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "204":
          description: OK

  /v1/my/claims/chunk:
    get:
      tags:
        - claims
      security:
        - bearerAuth: []
      parameters:
        - name: page_size
          required: false
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  claims:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/claim"
                        - properties:
                            id:
                              type: integer
                              format: int64
                              minimum: 0
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time

  # ! Эндпоинты для новостей
  /v1/announcements/{announcementID}:
    get:
      tags:
        - announcement
      security:
        - bearerAuth: []
      parameters:
        - name: announcementID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      responses:
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/announcementFullForUsers"

  /v1/announcements/chunk:
    get:
      tags:
        - announcement
      security:
        - bearerAuth: []
      parameters:
        - name: page_size
          required: false
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: "#/components/schemas/announcementFullForUsers"

  # ! Эндпоинты для управления профилем
  /v1/me/:
    get:
      tags:
        - user
      security:
        - bearerAuth: []
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email

  # ! Вспомогательные эндпоинты

  /v1/categories/:
    get:
      tags:
        - categories
      security:
        - bearerAuth: []
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categories"

  /v1/map/claims:
    get:
      tags:
        - map
      security:
        - bearerAuth: []
      parameters:
        - name: lat1
          in: query
          required: true
          schema:
            type: string
            format: latitude
        - name: lat2
          in: query
          required: true
          schema:
            type: string
            format: latitude
        - name: long1
          in: query
          required: true
          schema:
            type: string
            format: longitude
        - name: long2
          in: query
          required: true
          schema:
            type: string
            format: longitude
      responses:
        "400":
          $ref: "#/components/responses/badRequest"
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          minimum: 0
                        latitude:
                          type: number
                          format: latitude
                        longitude:
                          type: number
                          format: longitude

  /v1/map/check-point:
    get:
      tags: [map]
      security: 
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: string
            format: latitude
        - name: long
          in: query
          required: true
          schema:
            type: string
            format: longitude
      responses:
        "400":
          description: Некорректное значение параметра lat или long
          $ref: "#/components/responses/badRequest"
        "200":
          description: Точка находится в полигоне
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    inside:
                      type: boolean

  /v1/map/districts:
    get:
      tags: [map]
      security: 
        - bearerAuth: []
      responses:
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  districts:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        polygon:
                          type: array
                          items:
                            type: object
                            properties:
                              longitude:
                                type: number
                                format: float64
                              latitude:
                                type: number
                                format: float64

  # ! Эндпоинты для панели администратора

  # ! Управление новостями
  /admin/v1/announcements/{announcementID}:
    get:
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: announcementID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      responses:
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/announcementFullForAdmins"

    delete:
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: announcementID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      responses:
        "404":
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "204":
          description: OK

    put:
      tags:
        - admin
      security:
        - bearerAuth: []
      parameters:
        - name: announcementID
          required: true
          in: path
          schema:
            type: string
            format: int64
            minimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/announcement"
        required: true
      responses:
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "404":
          description: Новость не найдена
          $ref: "#/components/responses/notFound"
        "204":
          description: Новость успешно обновлена

  /admin/v1/announcements:
    post:
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/announcement"
        required: true
      responses:
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer

  # ! Управление категориями

  /admin/v1/categories/:
    put:
      tags:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/categories"
        required: true
      responses:
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "500":
          $ref: "#/components/responses/internalServerError"
        "204":
          description: OK

  # ! Управление заявками

  /admin/v1/claims/{claimID}:
    get:
      description: Возвращает всю информацию о заявке
      tags: [admin]
      security: 
        - bearerAuth: []
      parameters:
        - name: claimID
          in: path
          schema:
            type: string
            format: int64
          required: true
      responses:
        "404":
          description: Заявка не найдена
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "200":
          description: Успешный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/claimFullForAdmins"
    
    delete:
      description: Удаляет заявку
      tags: [admin]
      security: 
        - bearerAuth: []
      parameters:
        - name: claimID
          in: path
          schema:
            type: string
            format: int64
          required: true
      responses:
        "404":
          description: Заявка не найдена
          $ref: "#/components/responses/notFound"
        "500":
          $ref: "#/components/responses/internalServerError"
        "204":
          description: Заявка удалена
  
  /admin/v1/claims/chunk:
    get:
      tags: [admin]
      security: 
        - bearerAuth: []
      parameters:
        - name: page_size
          required: false
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "500":
          $ref: "#/components/responses/internalServerError"
        "400":
          $ref: "#/components/responses/badRequest"
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  claims:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/claim"
                        - properties:
                            id:
                              type: integer
                              format: int64
                              minimum: 0
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
  
  /admin/v1/claims/{claimID}/feedback:
    post:
      description: Добавляет/обновляет обратную связь
      tags: [admin]
      security: 
        - bearerAuth: []
      parameters:
        - name: claimID
          in: path
          schema:
            type: string
            format: int64
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: ["feedback"]
              properties:
                feedback:
                  type: string
        required: true
      responses:
        "404":
          description: Заявка не найдена
          $ref: "#/components/responses/notFound"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "500":
          $ref: "#/components/responses/internalServerError"
        "204":
          description: Обратная связь добавлена/обновлена
          $ref: "#/components/responses/error"

  /admin/v1/claims/{claimID}/status:
    post:
      description: Обновляет статус заявки
      tags: [admin]
      security: 
