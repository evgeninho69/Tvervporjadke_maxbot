services:
  postgres:
    image: postgres:16-alpine
    container_name: tveractive-postgres
    environment:
      POSTGRES_DB: tveractive
      POSTGRES_USER: tveractive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tveractive -d tveractive"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile.prod
    container_name: core-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./core-api/.env
    environment:
      BUILD_ID: ${BUILD_ID:-timeweb}
      CORE_API_STORAGE: postgres
      DATABASE_URL: postgres://tveractive:${POSTGRES_PASSWORD:-change_me}@postgres:5432/tveractive
    restart: unless-stopped
    volumes:
      - ./max-bot-service/data:/app/data

  max-bot-service:
    build:
      context: ./max-bot-service
      dockerfile: Dockerfile.prod
    container_name: max-bot-service
    env_file:
      - ./max-bot-service/.env
    environment:
      BUILD_ID: ${BUILD_ID:-timeweb}
      CORE_API_BASE_URL: http://core-api:8088
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-https://tver4ever.ru/integrations/max/webhook}
    restart: unless-stopped
    volumes:
      - ./max-bot-service/data:/app/data

  max-miniapp:
    build:
      context: ./max-miniapp
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://tver4ever.ru}
        VITE_ACTIVE_TVER_BEARER_TOKEN: ${VITE_ACTIVE_TVER_BEARER_TOKEN:-}
        VITE_CHANNEL_HANDLE: ${VITE_CHANNEL_HANDLE:-@id695005444203_biz}
        VITE_CHANNEL_NAME: ${VITE_CHANNEL_NAME:-Тверь в порядке}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/max-miniapp/}
    container_name: max-miniapp
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: tveractive-caddy
    depends_on:
      - core-api
      - max-bot-service
      - max-miniapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
